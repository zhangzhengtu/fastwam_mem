# @package _global_

defaults:
  - override /data: robotwin_extra_8tasks
  - override /model: fastwam_idm
  - _self_

# dataloading
batch_size: 8
num_workers: 8
sampler:
  type: sequential_episode
  sampling_interval: 1
  shuffle_trajectories: true
  balance_dataset_step_counts: false

model:
  mot_checkpoint_mixed_attn: false

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 5
max_steps: 24000
log_every: 10
save_every: 2000
eval_every: 500

# training
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
