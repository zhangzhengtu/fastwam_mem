defaults:
  - robotwin
  - _self_

# Extra single-dataset RoboTwin LeRobot data config.
task_name: cover_blocks_hard
dataset_dir: /mnt/inspurfs/efm_t/yangganlin/workspace_tzz/data/extra_data/cover_blocks_hard

train:
  dataset_dirs:
    - ${data.dataset_dir}
  val_set_proportion: 0.01
  is_training_set: true
  pretrained_norm_stats: null
  text_embedding_cache_dir: ./data/text_embeds_cache/robotwin_extra/${data.task_name}

val:
  dataset_dirs:
    - ${data.dataset_dir}
  val_set_proportion: 0.01
  is_training_set: false
  pretrained_norm_stats: null
  text_embedding_cache_dir: ./data/text_embeds_cache/robotwin_extra/${data.task_name}
