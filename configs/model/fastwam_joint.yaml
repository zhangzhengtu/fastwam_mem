_target_: fastwam.runtime.create_fastwam_joint
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}
redirect_common_files: true
mot_checkpoint_mixed_attn: true
action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
skip_dit_load_from_pretrain: false

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_attention_mask_mode: "first_frame_causal" # default
  action_conditioned: false
  action_dim: ${data.train.processor.action_output_dim}
  action_group_causal_mask_mode: "group_diagonal"

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_video: 1.0
  lambda_action: 1.0

kem:
  enabled: true
  loss_weight: 1.0
  positive_weight: 7.0
  threshold: 0.5
  event_future_min_offset: 1
  event_commit_threshold: 0.55
  inference_nms_window: 20
  inference_cooldown_steps: 20
  debug_log_samples: false
  debug_log_max_samples: 1
  debug_log_rank: 0

keyframe_memory:
  enabled: true
  max_keyframes: 5
  history_step_offsets: [-10, -5]
  include_current_keyframe: false
  selection: latest
  order: chronological
  source_train: teacher
  source_eval: predict
  schedule_warmup_steps: 10000
  schedule_transition_steps: 30000
  schedule_teacher_prob_start: 1.0
  schedule_teacher_prob_end: 0.0
  schedule_mix_granularity: sample
  injection_mode: video_prefix_tokens
  rope_temporal_index: 0
  t_mod_source: current_first_frame
  compress_tokens: false
  structured_block: true
  use_memory_bos: true
  use_recent_bos: true
  memory_bos_insert_when_empty: false
  recent_bos_insert_when_empty: false
  use_relative_memory_rope: true
  relative_memory_rope_max_offset: 128
